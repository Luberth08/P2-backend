services:
  - type: web
    name: p2-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --ws-ping-interval 20 --ws-ping-timeout 20
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: FCM_VAPID_KEY
        sync: false
      - key: FCM_VAPID_KEY_PRIVATE
        sync: false
    # Importante: habilitar WebSocket
    autoDeploy: true
